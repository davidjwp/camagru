<body>

    <div class="header">
        <div class="header-left">
            <h1>Camagru</h1>
            <span class="tagline">create</span>
        </div>
        <div class="header-right">
            <button class="btn btn-home" onclick="window.location.href='../home.php'">Home</button>
            <button class="btn btn-profile" onclick="window.location.href='profile.php'">Profile</button>
            <form action="" method="post" style="display:inline;">
                <button class="btn btn-disconnect" name="disconnect" value="disconnect">sign out</button>
            </form>
        </div>
    </div>

    <div class="main-content">
        <div class="body-content">
            <div class="editor-main">
                <div id="webcam-container">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="preview"></canvas>
                    <button id="webcam-btn" onclick="backToWebcam()">back to webcam</button>
                    <input type="file" id="image-upload" accept=".jpeg,.jpg,.png">
                </div>
                <button id="capture-btn" disabled>Capture</button>
                <div id="stickers"></div>
            </div>
        </div>

        <div class="sidebar">
            <div class="editor-sidebar">
                <div id="user-posts"></div>
                <form id="upload" action="/handlers/upload_handler.php" method="post" enctype="multipart/form-data">
                    <input type="hidden" name="csrf-token" id="csrf-token">
                    <input type="file" name="file-upload" hidden>
                    <div id="tmp-thumbnails"></div>
                    <input type="submit" name="submit" value="Upload">
                </form>
            </div>
        </div>
    </div>
    <div class="footer">
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('preview');
        const captureBtn = document.getElementById('capture-btn');
        const uploadInput = document.getElementById('image-upload');
        const webcamBtn = document.getElementById('webcam-btn');
        const csrf = document.getElementById('csrf-token').value;
        // const upload = document.getElementById('upload');
        let img, loopRunning = false;
        let selectedSticker = null;
        let usingUpload = false;
        let stickerX = 0, stickerY = 0;
        let isDragging = false;
        let dragOffsetX, dragOffsetY;
        const stickerImg = new Image();

        // start webcam/video set size setup canvas and loop
        navigator.mediaDevices.getUserMedia({ video: {
                width: { ideal: 1280, max: 1920},
                height: { ideal: 720, max: 1080 }
        }})
        .then(stream => { video.srcObject = stream; 
            video.onloadedmetadata = function() {
                videoReady = true;
                setupCanvas({width: video.videoWidth, height: video.videoHeight});
                loopRunning = false;
                startPreviewLoop(video);
            };
        })
        .catch(err => {
            video.style.display = 'none';
            uploadInput.style.display = 'block';
        });

        //exactly what it sounds like, setup canvas width/height
        function setupCanvas(size) {
            canvas.width = size.width;
            canvas.height = size.height;
            
            stickerX = (canvas.width - stickerImg.width) / 2;
            stickerY = (canvas.height - stickerImg.height) / 2;
        }

        /*
            on uploading image get file and read it's metadata 
            setup canvas to fit img size and start loop onload then make file the img.src
            then turn image data into data URL for displaying on the page
        */
        uploadInput.addEventListener('change', event => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                img = new Image();
                img.onload = function() {
                    // Draw uploaded image to fixed-size canvas
                    if (img.height > 2000 || img.width > 2000 || 
                    img.height < 200 || img.width < 200)
                        return (alert('img size within 2000x2000 and 200x200'));
                    
                    setupCanvas({height: img.height, width: img.width});
                        
                    video.style.display = 'none';
                    canvas.style.display = 'block';
                    webcamBtn.style.display = 'block';
                    usingUpload = true;
                    
                    loopRunning = false;
                    startPreviewLoop(img);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        //on mousedown update sticker coordinates
        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;
            
            if (mx >= stickerX && mx <= stickerX + stickerImg.width &&
                my >= stickerY && my <= stickerY + stickerImg.height) {
                isDragging = true;
                dragOffsetX = mx - stickerX;
                dragOffsetY = my - stickerY;
            }
        });

        //on mousemove update sticker coordinates when dragging, release when mouseup
        canvas.addEventListener('mousemove', e => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            stickerX = (e.clientX - rect.left) * scaleX - dragOffsetX;
            stickerY = (e.clientY - rect.top) * scaleY - dragOffsetY;
        });

        canvas.addEventListener('mouseup', () => isDragging = false);
        
        //these are exactly the same for mobile
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const touch = e.touches[0];
            const mx = (touch.clientX - rect.left) * scaleX;
            const my = (touch.clientY - rect.top) * scaleY;
            
            if (mx >= stickerX && mx <= stickerX + stickerImg.width &&
                my >= stickerY && my <= stickerY + stickerImg.height) {
                isDragging = true;
                dragOffsetX = mx - stickerX;
                dragOffsetY = my - stickerY;
            }
        });

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const touch = e.touches[0];
            stickerX = (touch.clientX - rect.left) * scaleX - dragOffsetX;
            stickerY = (touch.clientY - rect.top) * scaleY - dragOffsetY;
        });

        canvas.addEventListener('touchend', () => {isDragging = false;});

        /*
            onclick capture button, if not an image upload draw the webcam on context
            send canvas data and sticker coordinates to php to superimpose on the image
        */
        function capture() {
            if (!usingUpload) {
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                if (selectedSticker && stickerImg.complete)
                    ctx.drawImage(stickerImg, stickerX, stickerY);
            }
            const data = canvas.toDataURL('image/jpeg');

            console.log('here');
            fetch('/handlers/edit_handler.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    image: data,
                    sticker: selectedSticker,
                    stickerX: stickerX,
                    stickerY: stickerY,
                    csrf_token: csrf
                    })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) addThumbnail(data.file);
                else console.log(data.error);
            })
            .catch(err=> {console.log('what ? ', err);});
        }

        //loop for drawing webcam or image and sticker on top
        function startPreviewLoop(source) {
            loopRunning = true;
            const ctx = canvas.getContext('2d');
            
            function loop() {
                if (!loopRunning) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
                
                if (selectedSticker && stickerImg.complete) {
                    ctx.drawImage(stickerImg, stickerX, stickerY);
                }
                
                requestAnimationFrame(loop);
            }        
            loop();
        }

        //onclick sticker remove all other sticker style, add style to selected and load sticker on image or webcam
        function selectSticker(el, path) {
            document.querySelectorAll('.sticker').forEach(s => s.classList.remove('selected'));
            el.classList.add('selected');
            selectedSticker = path;
            stickerImg.src = path;
            stickerImg.onload = () => {
                stickerX = (canvas.width - stickerImg.width) / 2;
                stickerY = (canvas.height - stickerImg.height) / 2;
                loopRunning = false;
                if (usingUpload) startPreviewLoop(img);
                else startPreviewLoop(video);
                captureBtn.disabled = false;
            };
        }

        //onclick function adds style, deselects all previous thumbnails and adds it to form upload
        function selectThumbnail() {
            document.querySelectorAll('.thumbnail').forEach(thmb => thmb.classList.remove('selected'));
            this.classList.add('selected');
            const selectedThumbnail = this.src.split('/').pop();

            const form = document.getElementById('upload');
            let hiddenInput = form.querySelector('input[name="selected_thumbnail"]');
            if (!hiddenInput) {
                hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.name = 'selected_thumbnail';
                form.appendChild(hiddenInput);
            }
            hiddenInput.value = selectedThumbnail;
        }

        //called after successful capture, builds thumbnail element with even listener and onclick
        function addThumbnail(file) {
            const sidebar = document.getElementById('tmp-thumbnails');
            const img = document.createElement('img');

            img.src = file;
            img.className = 'thumbnail';
            img.onclick = selectThumbnail;
            img.addEventListener('dblclick', event => {
                fetch('/handlers/edit_handler.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        delete_thumbnail: true,
                        img_src: img.src,
                        csrf_token: csrf
                    })});
                img.remove();
            });
            sidebar.prepend(img);
        }

        /*
            ajax fetch to get thumbnails then for each thumbnail gotten
            add img path and event listener for dblcick which deletes the img on the backend
            then removes it on the front end
        
        */
        function loadThumbnails() {
           fetch('/handlers/edit_handler.php', {
               method: 'POST',
               headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify({ get_thumbs: true, csrf_token: csrf })
           })
           .then(res => res.json())
           .then(data => {
               if (!data.success) return (console.log(data.error));
               if (!data.files) return;
               const sidebar = document.getElementById('tmp-thumbnails');
               data.files.forEach(thumb => {
                   const img = document.createElement('img');
                   img.src = data.path + thumb;
                   img.className = 'thumbnail';
                   img.onclick = selectThumbnail;
                   img.addEventListener('dblclick', event => {
                       fetch('/handlers/edit_handler.php', {
                           method: 'POST',
                           headers: { 'Content-Type': 'application/json' },
                           body: JSON.stringify({ 
                               delete_thumbnail: true,
                               img_src: img.src,
                               csrf_token: csrf
                           })});
                       img.remove();
                   });
                   sidebar.prepend(img);
               })
           })
           .catch(err=>{console.log('here faggot ', err);});
	    }

        //re-add canvas, remove webcamtBtn and start webcam preview
        function backToWebcam() {
            usingUpload = false;
    
            video.style.display = 'none';
            canvas.style.display = 'block';
            webcamBtn.style.display = 'none';
            uploadInput.value = '';
            
            img = null;
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            loopRunning = false;
            startPreviewLoop(video);
        }

        document.getElementById('capture-btn').addEventListener('click', capture);
        loadThumbnails();
    </script>

</body>
