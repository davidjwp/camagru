<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="/style.css">
    </head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>My Website</h1>
        <p>This is the header</p>
		<button id="profile_button" onclick="window.location.href='profile.php'">profile</button>
        <form action="" method="post">
			<button name="disconnect" value="disconnect">disconnect</button>
		</form>
		 <button id="home_button" onclick="window.location.href='home.php'">home</button>
    </div>

    <!-- Main body -->    
    <div class="main-content">
        <div class="body-content">

            <div class="editor-main">
                <div id="webcam-container">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="preview"></canvas>
                    <input type="file" id="image-upload" accept=".jpeg,.jpg,.png">
                </div>
                <div id="stickers">
            
                </div>
            
                <button id="capture-btn" disabled>Capture</button>

            </div>
        </div>
        
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="editor-sidebar">
                <div id="user-posts"></div>
                <form id="upload" action="/upload.php" method="post" enctype="multipart/form-data">
                    <input type="file" name="file-upload" hidden>
                    <div id="tmp-thumbnails"></div>
                    <input type="submit" name="submit">
                </form>
            </div>

            <!-- <form action="/upload.php" method="post" enctype="multipart/form-data">
                <input type="file" name="file-upload" accept=".jpeg,.jpg,.png">
                <div id="upload"></div>
                <input type="submit" name="submit">
            </form> -->
            <ul>
            </ul>
            <script>
                const video = document.getElementById('webcam');
                const canvas = document.getElementById('preview');
                const captureBtn = document.getElementById('capture-btn');
                let selectedSticker = null;

                // start webcam
                navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                })
                .catch(err => {
                    document.getElementById('webcam').style.display = 'none';
                    document.getElementById('image-upload').style.display = 'block';
                    console.log('No webcam:', err);
                });

                function selectSticker(el, path) {
                    // deselect all previous
                    document.querySelectorAll('.sticker').forEach(s => s.classList.remove('selected'));
                    el.classList.add('selected');
                    selectedSticker = path;
                    captureBtn.disabled = false;
                }

                function selectThumbnail() {
                    document.querySelectorAll('.thumbnail').forEach(thmb => thmb.classList.remove('selected'));
                    this.classList.add('selected');
                    const selectedThumbnail= '/tmp/' + this.src.split('/').pop();

                    const form = document.getElementById('upload');
                    const formData = new FormData(form);
                    let hiddenInput = form.querySelector('input[name="selected_thumbnail"]');
                    if (!hiddenInput) {
                        hiddenInput = document.createElement('input');
                        hiddenInput.type = 'hidden';
                        hiddenInput.name = 'selected_thumbnail';
                        form.appendChild(hiddenInput);
                    }
                    hiddenInput.value = selectedThumbnail;
                }

                function capture() {
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0); // webcam only, no sticker
                    const data = canvas.toDataURL('image/jpeg');
                    fetch('/Edit_handler.php', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ image: data, sticker: selectedSticker })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) addThumbnail(data.file);
                    });
                }

                function addThumbnail(file) {
                    const sidebar = document.getElementById('tmp-thumbnails');
                    const img = document.createElement('img');
                    img.src = '/tmp/' + file;
                    img.className = 'thumbnail';
                    img.onclick = selectThumbnail;
                    img.addEventListener('dblclick', event => {
                        fetch('/Edit_handler.php', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({delete_thumbnail: true, img_src: img.src})
                        });

                        img.remove();
                    });
                    sidebar.prepend(img);
                }
                
                function loadThumbnails(){
                    fetch('/Edit_handler.php', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({get_thumbs: true})
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (!data.files) return ;
                        
                        const sidebar = document.getElementById('tmp-thumbnails');
                        data.files.forEach(thumb => {
                            const img = document.createElement('img');
                            img.src = '/tmp/' + thumb;
                            img.className = 'thumbnail';
                            img.onclick = selectThumbnail;
                            img.addEventListener('dblclick', event => {
                                fetch('/Edit_handler.php', {
                                    method: 'POST',
                                    headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({delete_thumbnail: true, img_src: img.src})
                                });

                                img.remove();
                            });

                            sidebar.prepend(img);
                        })
                    })
                }

                document.getElementById('capture-btn').addEventListener('click', capture);
                loadThumbnails();
            </script>
        </div>
    </div>

    <div class="sticker-footer" id="sticker-footer">
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </div>

</body>
</html>
