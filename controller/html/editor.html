<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="/style.css">
    </head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>My Website</h1>
        <p>This is the header</p>
		<button id="profile_button" onclick="window.location.href='profile.php'">profile</button>
        <form action="" method="post">
			<button name="disconnect" value="disconnect">disconnect</button>
		</form>
		 <button id="home_button" onclick="window.location.href='../home.php'">home</button>
    </div>

    <!-- Main body -->    
    <div class="main-content">
        <div class="body-content">

            <div class="editor-main">
                <div id="webcam-container">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="preview" syle="display:none"></canvas>
                    <button id="webcam-btn" onclick="backToWebcam()" style="display: none;">back to webcam</button>
                    <input type="file" id="image-upload" accept=".jpeg,.jpg,.png">
                </div>
                <div id="stickers">
            
                </div>
            
                <button id="capture-btn" disabled>Capture</button>

            </div>
        </div>
        
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="editor-sidebar">
                <div id="user-posts"></div>
                <form id="upload" action="/handlers/upload_handler.php" method="post" enctype="multipart/form-data">
                    <input type="file" name="file-upload" hidden>
                    <div id="tmp-thumbnails"></div>
                    <input type="submit" name="submit">
                </form>
            </div>

            <ul>
            </ul>
            <script>
                const video = document.getElementById('webcam');
                const canvas = document.getElementById('preview');
                const captureBtn = document.getElementById('capture-btn');
                const uploadInput = document.getElementById('image-upload');
                const webcamBtn = document.getElementById('webcam-btn');
                let selectedSticker = null;
                let usingUpload = false;

                // start webcam
                navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {video.srcObject = stream;})
                .catch(err => {
                    video.style.display = 'none';
                    uploadInput.style.display = 'block';
                });

                uploadInput.addEventListener('change', event => {
                    const file = event.target.files[0];
                    if (!file) return ;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const img = new Image();
                        img.onload = function() {
                            canvas.width = img.width;
                            canvas.height = img.height;
                            canvas.getContext('2d').drawImage(img, 0, 0);
                            video.style.display = 'none';
                            canvas.style.display = 'block';
                            webcamBtn.style.display = 'block';
                            usingUpload = true;
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });

                function selectSticker(el, path) {
                    // deselect all previous
                    document.querySelectorAll('.sticker').forEach(s => s.classList.remove('selected'));
                    el.classList.add('selected');
                    selectedSticker = path;
                    captureBtn.disabled = false;
                }

                function selectThumbnail() {
                    document.querySelectorAll('.thumbnail').forEach(thmb => thmb.classList.remove('selected'));
                    this.classList.add('selected');
                    const selectedThumbnail= '/tmp/' + this.src.split('/').pop();

                    const form = document.getElementById('upload');
                    const formData = new FormData(form);
                    let hiddenInput = form.querySelector('input[name="selected_thumbnail"]');
                    if (!hiddenInput) {
                        hiddenInput = document.createElement('input');
                        hiddenInput.type = 'hidden';
                        hiddenInput.name = 'selected_thumbnail';
                        form.appendChild(hiddenInput);
                    }
                    hiddenInput.value = selectedThumbnail;
                }

                function capture() {
                    const ctx = canvas.getContext('2d');
                    if (!usingUpload) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        ctx.drawImage(video, 0, 0); // webcam only, no sticker
                    }
                    const data = canvas.toDataURL('image/jpeg');
                    fetch('/handlers/edit_handler.php', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ image: data, sticker: selectedSticker })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) addThumbnail(data.file);
                    });
                }

                function addThumbnail(file) {
                    const sidebar = document.getElementById('tmp-thumbnails');
                    const img = document.createElement('img');
                    img.src = '/tmp/' + file;
                    img.className = 'thumbnail';
                    img.onclick = selectThumbnail;
                    img.addEventListener('dblclick', event => {
                        fetch('/handlers/edit_handler.php', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({delete_thumbnail: true, img_src: img.src})
                        });

                        img.remove();
                    });
                    sidebar.prepend(img);
                }
                
                function loadThumbnails(){
                    fetch('/handlers/edit_handler.php', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({get_thumbs: true})
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (!data.files) return ;
                        
                        const sidebar = document.getElementById('tmp-thumbnails');
                        data.files.forEach(thumb => {
                            const img = document.createElement('img');
                            img.src = '/tmp/' + thumb;
                            img.className = 'thumbnail';
                            img.onclick = selectThumbnail;
                            img.addEventListener('dblclick', event => {
                                fetch('/handlers/edit_handler.php', {
                                    method: 'POST',
                                    headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({delete_thumbnail: true, img_src: img.src})
                                });

                                img.remove();
                            });

                            sidebar.prepend(img);
                        })
                    })
                }

                
                function backToWebcam() {
                    canvas.style.display = 'none';
                    video.style.display = 'block';
                    webcamBtn.style.display = 'none';
                    uploadInput.value = ''; // clear file selection
                    usingUpload = false;
                }

                document.getElementById('capture-btn').addEventListener('click', capture);
                loadThumbnails();
            </script>
        </div>
    </div>

    <div class="sticker-footer" id="sticker-footer">
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </div>

</body>
</html>
