<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="/style.css">
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html, body {
				font-family: 'Segoe UI', Arial, sans-serif;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				background: #f0f2f5;
			}

			/* ===== HEADER ===== */
			.header {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				padding: 14px 30px;
				display: flex;
				justify-content: space-between;
				align-items: center;
				flex-shrink: 0;
				box-shadow: 0 2px 8px rgba(0,0,0,0.15);
				flex-wrap: wrap;
				gap: 8px;
			}

			.header-left {
				display: flex;
				align-items: center;
				gap: 14px;
			}

			.header-left h1 {
				color: white;
				font-size: 22px;
				font-weight: 700;
				letter-spacing: -0.3px;
			}

			.header-left .tagline {
				color: rgba(255,255,255,0.6);
				font-size: 12px;
				font-weight: 300;
			}

			.header-right {
				display: flex;
				align-items: center;
				gap: 8px;
				flex-wrap: wrap;
			}

			/* ===== HEADER BUTTONS ===== */
			.btn-header {
				padding: 7px 16px;
				border: none;
				border-radius: 6px;
				font-size: 12px;
				font-weight: 600;
				cursor: pointer;
				transition: all 0.25s ease;
				text-decoration: none;
			}

			.btn-home {
				background: rgba(255,255,255,0.10);
				color: rgba(255,255,255,0.8);
				border: 1px solid rgba(255,255,255,0.06);
			}

			.btn-home:hover {
				background: rgba(255,255,255,0.20);
				color: white;
				transform: translateY(-1px);
			}

			.btn-edit {
				background: rgba(255,255,255,0.15);
				color: white;
				border: 1px solid rgba(255,255,255,0.1);
			}

			.btn-edit:hover {
				background: rgba(255,255,255,0.25);
				transform: translateY(-1px);
			}

			.btn-disconnect {
				background: transparent;
				color: rgba(255,255,255,0.4);
				font-size: 11px;
				padding: 5px 12px;
				border: 1px solid rgba(255,255,255,0.06);
			}

			.btn-disconnect:hover {
				color: rgba(255,255,255,0.8);
				background: rgba(255,255,255,0.06);
				border-color: rgba(255,255,255,0.12);
			}

			/* ===== MAIN CONTENT ===== */
			.main-content {
				flex: 1;
				padding: 30px 24px;
				max-width: 600px;
				margin: 0 auto;
				width: 100%;
			}

			/* ===== PROFILE CARD ===== */
			.profile-card {
				background: white;
				border-radius: 16px;
				padding: 32px 36px;
				box-shadow: 0 2px 12px rgba(0,0,0,0.06);
			}

			.profile-card .avatar {
				width: 72px;
				height: 72px;
				border-radius: 50%;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 32px;
				color: white;
				font-weight: 600;
				margin-bottom: 16px;
			}

			.profile-card h2 {
				font-size: 22px;
				color: #2d3748;
				margin-bottom: 4px;
			}

			.profile-card .email-display {
				color: #718096;
				font-size: 14px;
				margin-bottom: 24px;
			}

			/* ===== DIVIDER ===== */
			.divider {
				border: none;
				border-top: 1px solid #e2e8f0;
				margin: 20px 0;
			}

			/* ===== FORM SECTIONS ===== */
			.section-label {
				font-size: 13px;
				font-weight: 600;
				color: #4a5568;
				margin-bottom: 12px;
				display: block;
			}

			.profile-form {
				margin-bottom: 20px;
			}

			.profile-form:last-child {
				margin-bottom: 0;
			}

			.profile-form input[type="text"],
			.profile-form input[type="email"],
			.profile-form input[type="password"] {
				width: 100%;
				padding: 10px 14px;
				margin-bottom: 8px;
				border: 2px solid #e2e8f0;
				border-radius: 8px;
				font-size: 14px;
				transition: border-color 0.2s, box-shadow 0.2s;
				background: #fafbfc;
			}

			.profile-form input[type="text"]:focus,
			.profile-form input[type="email"]:focus,
			.profile-form input[type="password"]:focus {
				outline: none;
				border-color: #667eea;
				box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
				background: white;
			}

			.profile-form .helper {
				font-size: 12px;
				color: #a0aec0;
				margin: -4px 0 10px 0;
				display: block;
			}

			/* ===== BUTTONS ===== */
			.btn-primary {
				padding: 10px 24px;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				border: none;
				border-radius: 8px;
				font-size: 14px;
				font-weight: 600;
				cursor: pointer;
				transition: all 0.25s;
			}

			.btn-primary:hover {
				transform: scale(1.02);
				box-shadow: 0 8px 25px rgba(102,126,234,0.3);
			}

			.btn-primary:active {
				transform: scale(0.98);
			}

			.btn-secondary {
				padding: 8px 20px;
				background: transparent;
				color: #667eea;
				border: 2px solid #667eea;
				border-radius: 8px;
				font-size: 13px;
				font-weight: 600;
				cursor: pointer;
				transition: all 0.25s;
			}

			.btn-secondary:hover {
				background: #667eea;
				color: white;
			}

			.btn-danger {
				padding: 8px 20px;
				background: transparent;
				color: #e53e3e;
				border: 1px solid #e53e3e;
				border-radius: 8px;
				font-size: 12px;
				font-weight: 500;
				cursor: pointer;
				transition: all 0.25s;
			}

			.btn-danger:hover {
				background: #e53e3e;
				color: white;
			}

			/* ===== CHECKBOX TOGGLE ===== */
			.toggle-row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 12px 0;
			}

			.toggle-row label {
				font-size: 14px;
				color: #4a5568;
				cursor: pointer;
			}

			.toggle-row .switch {
				position: relative;
				width: 44px;
				height: 24px;
				flex-shrink: 0;
			}

			.toggle-row .switch input {
				opacity: 0;
				width: 0;
				height: 0;
			}

			.toggle-row .switch .slider {
				position: absolute;
				cursor: pointer;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				background: #cbd5e0;
				border-radius: 24px;
				transition: background 0.3s;
			}

			.toggle-row .switch .slider::before {
				content: '';
				position: absolute;
				height: 18px;
				width: 18px;
				left: 3px;
				bottom: 3px;
				background: white;
				border-radius: 50%;
				transition: transform 0.3s;
				box-shadow: 0 1px 4px rgba(0,0,0,0.15);
			}

			.toggle-row .switch input:checked + .slider {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			}

			.toggle-row .switch input:checked + .slider::before {
				transform: translateX(20px);
			}

			/* ===== STATUS MESSAGE ===== */
			.status-msg {
				padding: 10px 14px;
				border-radius: 8px;
				font-size: 13px;
				margin-top: 12px;
				display: none;
			}

			.status-msg.success {
				display: block;
				background: #e6f7e6;
				color: #2d7a2d;
				border: 1px solid #b8e6b8;
			}

			.status-msg.error {
				display: block;
				background: #fde8e8;
				color: #c0392b;
				border: 1px solid #f5c6c6;
			}

			/* ===== FOOTER ===== */
			.footer {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				padding: 12px 30px;
				text-align: center;
				flex-shrink: 0;
				margin-top: auto;
			}

			.footer p {
				color: rgba(255,255,255,0.4);
				font-size: 12px;
				letter-spacing: 0.3px;
			}

			/* ===== RESPONSIVE ===== */
			@media (max-width: 600px) {
				.header {
					padding: 10px 14px;
				}
				.header-left h1 {
					font-size: 18px;
				}
				.header-left .tagline {
					display: none;
				}
				.main-content {
					padding: 16px 12px;
				}
				.profile-card {
					padding: 20px 18px;
				}
				.profile-card h2 {
					font-size: 18px;
				}
				.btn-header {
					font-size: 11px;
					padding: 5px 12px;
				}
			}
		</style>
	</head>
	<body>

		<!-- ===== HEADER ===== -->
		<div class="header">
			<div class="header-left">
				<h1>Camagru</h1>
				<span class="tagline">profile</span>
			</div>
			<div class="header-right">
				<button class="btn-header btn-home" onclick="window.location.href='/home.php'">Home</button>
				<button class="btn-header btn-edit" onclick="window.location.href='editor.php'">Edit</button>
				<form action="" method="post" style="display:inline;">
					<button class="btn-header btn-disconnect" name="disconnect" value="disconnect">sign out</button>
				</form>
			</div>
		</div>

		<!-- ===== MAIN CONTENT ===== -->
		<div class="main-content">
			<div class="profile-card">

				<!-- Avatar & Welcome -->
				<div class="avatar" id="avatar">U</div>
				<h2 id="welcome_header">Welcome back</h2>
				<div class="email-display" id="email_display">user@example.com</div>

				<hr class="divider">

				<!-- Notification Toggle -->
				<div class="toggle-row">
					<label for="notif-toggle">Email notifications</label>
					<div class="switch">
						<input type="checkbox" id="notif-toggle">
						<span class="slider"></span>
					</div>
				</div>

				<hr class="divider">

				<!-- Change Username / Email -->
				<span class="section-label">Update profile</span>
				<form class="profile-form" action="/profile.php" method="post">
					<input type="text" name="username" placeholder="New username">
					<input type="text" name="email" placeholder="New email">
					<span class="helper" id="email_info"></span>
					<button class="btn-primary" type="submit" name="update_profile" value="1">Update profile</button>
				</form>

				<hr class="divider">

				<!-- Reset Password -->
				<span class="section-label">Security</span>
				<form class="profile-form" action="/profile.php" method="post">
					<button class="btn-secondary" type="submit" name="reset_password" value="1">Reset password</button>
				</form>

				<!-- Status Message -->
				<div class="status-msg" id="statusMsg"></div>

			</div>
		</div>

		<!-- ===== FOOTER ===== -->
		<div class="footer">
			<p></p>
		</div>

		<!-- ===== SCRIPTS ===== -->
		<script>
			// Load user data
			// fetch('/api/user.php')
			// 	.then(res => res.json())
			// 	.then(user => {
			// 		if (user.username) {
			// 			document.getElementById('welcome_header').textContent = 'Welcome, ' + user.username;
			// 			document.getElementById('email_display').textContent = user.email;
			// 			document.getElementById('avatar').textContent = user.username.charAt(0).toUpperCase();
			// 		}
			// 	})
			// 	.catch(() => {});

			// Notification toggle
			const toggle = document.getElementById('notif-toggle');
			toggle.addEventListener('change', function() {
				fetch('/profile.php', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						notification: this.checked,
						checked: true
					})
				})
				.then(res => res.json())
				.then(data => {
					if (data.success) {
						showStatus('Notification settings updated', 'success');
					}
				})
				.catch(() => showStatus('Failed to update settings', 'error'));
			});

			// Load notification state
			// fetch('/api/notification.php')
			// 	.then(res => res.json())
			// 	.then(data => {
			// 		if (data.enabled !== undefined) {
			// 			toggle.checked = data.enabled;
			// 		}
			// 	})
			// 	.catch(() => {});

			// Status messages
			function showStatus(message, type) {
				const el = document.getElementById('statusMsg');
				el.textContent = message;
				el.className = 'status-msg ' + type;
				clearTimeout(el._timeout);
				el._timeout = setTimeout(() => {
					el.className = 'status-msg';
				}, 4000);
			}

			// Check URL params for success/error
			const params = new URLSearchParams(window.location.search);
			if (params.get('updated') === '1') {
				showStatus('Profile updated successfully!', 'success');
			} else if (params.get('error')) {
				showStatus(params.get('error'), 'error');
			}
		</script>

	</body>
</html>
