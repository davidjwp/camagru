<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f0f2f5;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-left h1 {
            color: white;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-left .tagline {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            font-weight: 300;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-header {
            padding: 7px 16px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .btn-home {
            background: rgba(255,255,255,0.10);
            color: rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .btn-home:hover {
            background: rgba(255,255,255,0.20);
            color: white;
            transform: translateY(-1px);
        }

        .btn-profile {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-profile:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-1px);
        }

        .btn-disconnect {
            background: transparent;
            color: rgba(255,255,255,0.4);
            font-size: 11px;
            padding: 5px 12px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .btn-disconnect:hover {
            color: rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.12);
        }

        .post_content {
            flex: 1;
            max-width: 1500px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
        }

        .post-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }

        .post-card .post-image {
            width: 100%;
            height: auto;
            display: block;
            background: #1a1a2e;
        }

        .post-card .post-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            border-bottom: 1px solid #f0f2f5;
        }

        .post-card .post-actions .like-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #4a5568;
            transition: color 0.2s;
        }

        .post-card .post-actions .like-btn:hover {
            color: #e53e3e;
        }

        .post-card .post-actions .like-btn .heart {
            width: 28px;
            height: 28px;
            transition: transform 0.2s;
        }

        .post-card .post-actions .like-btn .heart.liked {
            fill: #e53e3e;
        }

        .post-card .post-actions .like-btn .heart.animate {
            animation: heartPop 0.3s ease;
        }

        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .post-card .post-actions .like-count {
            font-weight: 600;
            color: #2d3748;
            min-width: 60px;
        }

        .post-card .post-actions .delete-btn {
            margin-left: auto;
            background: transparent;
            border: none;
            color: #a0aec0;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .post-card .post-actions .delete-btn:hover {
            color: #e53e3e;
            background: #fff5f5;
        }

        .post-card .post-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: #fafbfc;
            border-bottom: 1px solid #f0f2f5;
        }

        .post-card .post-meta .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .post-card .post-meta .username {
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;
        }

        .post-card .post-meta .post-time {
            color: #a0aec0;
            font-size: 12px;
            margin-left: auto;
        }

        .comment-section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .comment-section .comment-form {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .comment-section .comment-form .comment-input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafbfc;
        }

        .comment-section .comment-form .comment-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
            background: white;
        }

        .comment-section .comment-form .comment-submit {
            padding: 10px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
        }

        .comment-section .comment-form .comment-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(102,126,234,0.3);
        }

        .comment-section .comment-form .comment-submit:active {
            transform: scale(0.98);
        }

        .comment-section .comments {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .comment-section .comments .comment {
            padding: 12px 16px;
            background: #fafbfc;
            border-radius: 10px;
            border-left: 3px solid #667eea;
        }

        .comment-section .comments .comment .com_info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .comment-section .comments .comment .com_info .com_user {
            font-weight: 600;
            color: #2d3748;
            font-size: 13px;
        }

        .comment-section .comments .comment .com_info .com_time {
            color: #a0aec0;
            font-size: 11px;
        }

        .comment-section .comments .comment .com_cont {
            color: #4a5568;
            font-size: 14px;
            line-height: 1.5;
        }

        .comment-section .no-comments {
            text-align: center;
            color: #a0aec0;
            padding: 30px 0;
            font-size: 14px;
        }

        .footer {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px 30px;
            text-align: center;
            flex-shrink: 0;
            margin-top: auto;
        }

        .footer p {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        @media (max-width: 600px) {
            .header {
                padding: 10px 14px;
            }
            .header-left h1 {
                font-size: 18px;
            }
            .header-left .tagline {
                display: none;
            }
            .btn-header {
                font-size: 11px;
                padding: 5px 12px;
            }
            .post_content {
                padding: 0 12px;
                margin: 16px auto;
            }
            .post-card .post-actions {
                padding: 10px 14px;
                flex-wrap: wrap;
            }
            .post-card .post-meta {
                padding: 10px 14px;
                flex-wrap: wrap;
            }
            .comment-section {
                padding: 14px;
            }
            .comment-section .comment-form {
                flex-wrap: wrap;
            }
            .comment-section .comment-form .comment-submit {
                width: 100%;
            }
            .comment-section .comments .comment {
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <h1>Camagru</h1>
            <span class="tagline">post</span>
        </div>
        <div class="header-right">
            <button class="btn-header btn-home" onclick="window.location.href='home.php'">Home</button>
            <button class="btn-header btn-profile" onclick="window.location.href='profile.php'">Profile</button>
            <form action="" method="post" style="display:inline;">
                <button class="btn-header btn-disconnect" name="disconnect" value="disconnect">sign out</button>
            </form>
        </div>
    </div>

    <div class="post_content">

        <div class="post-card">
            <div id="post"></div>
        </div>

        <div class="comment-section">
            <form class="comment-form" action="/post.php" method="post">
                <input class="comment-input" name="comment_text" type="text" placeholder="Write a comment..." autocomplete="off">
                <input type="submit" class="comment-submit" name="submit" value="Comment">
            </form>
            <div id="comments">
            </div>
        </div>

    </div>

    <div class="footer">
        <p>&copy; 2026 Camagru &bull; All rights reserved</p>
    </div>

    <script>
        function toggleLike(postId, postLiked, like_count) {
            fetch('/like.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: postId, liked: postLiked })
            })
            .then(res => res.json())
            .then(data => {
                const heart = document.getElementById('heart' + postId);
                const counter = document.getElementById('likes_counter');

                heart.classList.toggle('liked');
                heart.classList.add('animate');

                if (!data.like_count) {
                    counter.textContent = '0 likes';
                } else {
                    counter.textContent = data.like_count + ' likes';
                }

                setTimeout(() => heart.classList.remove('animate'), 300);
            })
            .catch(err => console.error('Like error:', err));
        }

        function del() {
            if (confirm('Are you sure you want to delete this post?')) {
                fetch('/post.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ delete: true })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/home.php';
                    }
                })
                .catch(err => console.error('Delete error:', err));
            }
        }
    </script>

</body>
</html>
