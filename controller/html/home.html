<!DOCTYPE html>
<html>
    <head>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html, body {
                font-family: 'Segoe UI', Arial, sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                background: #f0f2f5;
            }

            .header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                padding: 16px 30px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-shrink: 0;
                box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            }

            .header-left {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .header-left h1 {
                color: white;
                font-size: 24px;
                font-weight: 700;
                letter-spacing: -0.5px;
            }

            .header-left {
                color: rgba(255,255,255,0.7);
                font-size: 13px;
                font-weight: 300;
            }

            .header-right {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .btn {
                padding: 8px 18px;
                border: none;
                border-radius: 6px;
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.25s ease;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }

            .btn-profile {
                background: rgba(255,255,255,0.15);
                color: white;
                backdrop-filter: blur(4px);
                border: 1px solid rgba(255,255,255,0.1);
            }

            .btn-profile:hover {
                background: rgba(255,255,255,0.25);
                transform: translateY(-1px);
            }

            .btn-edit {
                background: rgba(255,255,255,0.12);
                color: white;
                border: 1px solid rgba(255,255,255,0.15);
            }

            .btn-edit:hover {
                background: rgba(255,255,255,0.22);
                transform: translateY(-1px);
            }

            .btn-disconnect {
                background: transparent;
                color: rgba(255,255,255,0.5);
                font-size: 12px;
                padding: 6px 14px;
                border: 1px solid rgba(255,255,255,0.08);
            }

            .btn-disconnect:hover {
                color: rgba(255,255,255,0.85);
                background: rgba(255,255,255,0.06);
                border-color: rgba(255,255,255,0.15);
            }

            .main-content {
                flex: 1;
                padding: 24px 30px;
                max-width: 1200px;
                margin: 0 auto;
                width: 100%;
            }

            #posts {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 18px;
                padding: 0;
            }

            .post {
                background: white;
                border-radius: 10px;
                overflow: hidden;
                box-shadow: 0 2px 8px rgba(0,0,0,0.06);
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }

            .post:hover {
                transform: translateY(-4px);
                box-shadow: 0 8px 25px rgba(0,0,0,0.10);
            }

            .post img {
                width: 100%;
                height: 200px;
                object-fit: cover;
                display: block;
            }

            .post .post-info {
                padding: 10px 14px 14px;
            }

            .post .post-info .username {
                font-weight: 600;
                color: #2d3748;
                font-size: 14px;
            }

            .post .post-info .meta {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 6px;
                font-size: 12px;
                color: #a0aec0;
            }

            .post .post-info .meta .likes {
                display: flex;
                align-items: center;
                gap: 4px;
            }

            .post .post-info .meta .likes::before {
                content: '♥';
                color: #e53e3e;
                font-size: 13px;
            }

            /* ===== PAGINATION ===== */
            #pagination {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 12px;
                padding: 30px 0 10px;
            }

            #pagination a {
                padding: 8px 18px;
                background: white;
                border: 1px solid #e2e8f0;
                border-radius: 6px;
                text-decoration: none;
                color: #4a5568;
                font-size: 13px;
                font-weight: 500;
                transition: all 0.2s;
            }

            #pagination a:hover {
                background: #667eea;
                color: white;
                border-color: #667eea;
            }

            #pagination .page-indicator {
                color: #718096;
                font-size: 13px;
                padding: 0 8px;
            }

            .empty-state {
                text-align: center;
                padding: 60px 20px;
                color: #a0aec0;
            }

            .empty-state p {
                font-size: 18px;
                font-weight: 500;
                color: #4a5568;
            }

            .empty-state small {
                font-size: 14px;
            }

            .footer {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                padding: 14px 30px;
                text-align: center;
                flex-shrink: 0;
                margin-top: auto;
            }

            .footer p {
                color: rgba(255,255,255,0.5);
                font-size: 12px;
                letter-spacing: 0.3px;
            }

			@media screen and (max-device-width: 700px), screen and (min-device-width: 3000px) {
				html {
					font-size: 25px;
				}

                .header {
					padding: 16px 20px;
					width: 100%;
					border-radius: 0;
				}

				.header-left h1 {
					font-size: 2.2rem;
				}

				.header-left .tagline {
					font-size: 1.2rem;
				}

				.btn {
					font-size: 1.3rem;
					padding: 12px 24px;
				}

				.btn-disconnect {
					font-size: 1.1rem;
					padding: 10px 18px;
				}

                .post {
                    
                }
                #pagination a {
                    font-size: 35px;
                }

                .footer {
					padding: 16px 20px;
					width: 100%;
					margin-top: auto;
					border-radius: 0;
				}

				.footer p {
					font-size: 1rem;
					padding: 4px 0;
				}

            }
        </style>
    </head>
<body>

    <div class="header">
        <div class="header-left">
            <h1>Camagru</h1>
        </div>

        <div class="header-right">
            <button class="btn btn-edit" onclick="window.location.href='editor.php';">Edit</button>
            <button class="btn btn-profile" onclick="window.location.href='profile.php';">Profile</button>
            <form action="" method="post" style="display:inline;">
                <button class="btn btn-disconnect" name="disconnect" value="disconnect">sign out</button>
            </form>
        </div>
    </div>

    <div class="main-content">
        <div id="posts"></div>
        <div id="pagination"></div>
    </div>

    <div class="footer">
    </div>

</body>
</html>
