name: camagru

services:
  model:
    image: mysql:latest
    container_name: model
    env_file:
      - .env
    volumes:
      - mysql:/var/lib/mysql
      - ./model/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - camagru_net

  controller:
    container_name: controller
    env_file: .env
    build:
      args: 
        SERV_PORT: ${SERV_PORT}
        SERV_ADDRESS: ${SERV_ADDRESS}
      context: ./controller
    restart: always
    develop:
      watch:
        - action: sync
          path: ../view
          target: /var/www/html
    volumes:
      - type: bind
        source: ./controller/html
        target: /var/www/html
    ports:
      - "${SERV_PORT}:${SERV_PORT}"
    networks:
      - camagru_net

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - camagru_net
    logging:
     driver: 'none'

volumes:
  mysql:
    name: mysql

  controller:
    name: controller

networks:
  camagru_net:
    driver: bridge
